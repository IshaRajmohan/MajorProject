# Alembic configuration for the NyayaOS async PostgreSQL foundation.
#
# The connection URL is NOT stored here. It is read from the DATABASE_URL
# environment variable (or a local .env file) by alembic/env.py so that
# credentials are never committed to the repository.

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally blank — env.py sets it from DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

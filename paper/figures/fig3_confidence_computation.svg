<svg viewBox="0 0 740 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#0b0b0b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="740" height="500" fill="#ffffff"/>

  <!-- Four factor boxes, each a distinct categorical hue -->
  <rect x="24"  y="22" width="156" height="76" rx="8" fill="#dbe9fa" stroke="#2a78d6" stroke-width="1.6" filter="url(#soft3)"/>
  <text x="102" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#104281">A</text>
  <text x="102" y="69" text-anchor="middle" font-size="10.5" fill="#184f95">source authority</text>
  <text x="102" y="83" text-anchor="middle" font-size="10.5" fill="#184f95">(fact type, role)</text>

  <rect x="196" y="22" width="156" height="76" rx="8" fill="#fde6da" stroke="#eb6834" stroke-width="1.6" filter="url(#soft3)"/>
  <text x="274" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#a3431a">T</text>
  <text x="274" y="69" text-anchor="middle" font-size="10.5" fill="#a3431a">temporal consistency</text>
  <text x="274" y="83" text-anchor="middle" font-size="10.5" fill="#a3431a">(event vs. chronology)</text>

  <rect x="368" y="22" width="156" height="76" rx="8" fill="#d6f2e8" stroke="#1baf7a" stroke-width="1.6" filter="url(#soft3)"/>
  <text x="446" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#116a49">X</text>
  <text x="446" y="69" text-anchor="middle" font-size="10.5" fill="#116a49">cross-source</text>
  <text x="446" y="83" text-anchor="middle" font-size="10.5" fill="#116a49">corroboration</text>

  <rect x="540" y="22" width="156" height="76" rx="8" fill="#fcecc2" stroke="#c98500" stroke-width="1.6" filter="url(#soft3)"/>
  <text x="618" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#7a5100">E</text>
  <text x="618" y="69" text-anchor="middle" font-size="10.5" fill="#7a5100">extraction</text>
  <text x="618" y="83" text-anchor="middle" font-size="10.5" fill="#7a5100">reliability</text>

  <line x1="102" y1="98" x2="335" y2="160" stroke="#8b8a83" stroke-width="1.1" marker-end="url(#arrow3)"/>
  <line x1="274" y1="98" x2="352" y2="160" stroke="#8b8a83" stroke-width="1.1" marker-end="url(#arrow3)"/>
  <line x1="446" y1="98" x2="405" y2="160" stroke="#8b8a83" stroke-width="1.1" marker-end="url(#arrow3)"/>
  <line x1="618" y1="98" x2="422" y2="160" stroke="#8b8a83" stroke-width="1.1" marker-end="url(#arrow3)"/>

  <rect x="185" y="162" width="370" height="60" rx="9" fill="#eef2f7" stroke="#5a6b85" stroke-width="1.8" filter="url(#soft3)"/>
  <text x="370" y="188" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1a1a19">C = w_A&#183;A + w_T&#183;T + w_X&#183;X + w_E&#183;E</text>
  <text x="370" y="207" text-anchor="middle" font-size="10.5" fill="#52514e">weights configured per deployment, w_A+w_T+w_X+w_E = 1</text>

  <line x1="370" y1="222" x2="370" y2="248" stroke="#8b8a83" stroke-width="1.4" marker-end="url(#arrow3)"/>

  <rect x="220" y="250" width="300" height="46" rx="7" fill="#f6f6f4" stroke="#b6b5ae" stroke-width="1.2"/>
  <text x="370" y="278" text-anchor="middle" font-size="13" fill="#1a1a19">Rank candidates by C; take C1, C2</text>

  <line x1="370" y1="296" x2="370" y2="322" stroke="#8b8a83" stroke-width="1.4" marker-end="url(#arrow3)"/>

  <polygon points="370,324 484,374 370,424 256,374" fill="#eef2f7" stroke="#5a6b85" stroke-width="1.3"/>
  <text x="370" y="367" text-anchor="middle" font-size="11.5" fill="#1a1a19">C1 &#8805; &#964; and</text>
  <text x="370" y="383" text-anchor="middle" font-size="11.5" fill="#1a1a19">(C1&#8722;C2) &#8805; &#948; ?</text>

  <line x1="370" y1="424" x2="370" y2="448" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arrow3)"/>
  <text x="390" y="440" font-size="11" fill="#0ca30c" font-weight="600">yes</text>
  <rect x="255" y="450" width="230" height="38" rx="7" fill="#e6f6e6" stroke="#0ca30c" stroke-width="1.6"/>
  <text x="370" y="474" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0a7d0a">Update Twin State</text>

  <line x1="256" y1="374" x2="116" y2="374" stroke="#8b8a83" stroke-width="1.4" marker-end="url(#arrow3)"/>
  <text x="180" y="366" font-size="11" fill="#52514e">no</text>
  <rect x="4" y="349" width="164" height="50" rx="7" fill="#fdf1e0" stroke="#c98500" stroke-width="1.6"/>
  <text x="86" y="370" text-anchor="middle" font-size="11.5" fill="#7a5100">Retain / mark</text>
  <text x="86" y="386" text-anchor="middle" font-size="11.5" fill="#7a5100">unresolved</text>

  <text x="370" y="482" text-anchor="middle" font-size="0"></text>
</svg>
